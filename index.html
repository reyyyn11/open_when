<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Открой, когда…</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Onest:wght@400;600&display=swap">
<style>
:root{--bg:#dfe8f3;--ink:#23304a;--soft:#5d6b86;--env:#f4c3c9;--env2:#eaa9b3;--paper:#fffdf7;--seal:#c8475d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171e2e;--ink:#eef1f7;--soft:#a3adc4;--env:#d98f9b;--env2:#c97886;--paper:#262f45;--seal:#f08aa0}}
:root[data-theme="dark"]{--bg:#171e2e;--ink:#eef1f7;--soft:#a3adc4;--env:#d98f9b;--env2:#c97886;--paper:#262f45;--seal:#f08aa0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:40px 20px 60px}
h1{font-family:Caveat,cursive;font-weight:700;font-size:clamp(46px,11vw,72px);line-height:1;margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 32px;max-width:46ch;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.env{position:relative;height:140px;border:0;padding:0;cursor:pointer;background:var(--env);border-radius:6px;color:#3a1f27;font:inherit;box-shadow:0 6px 14px rgba(35,48,74,.18);transition:transform .2s}
.env:hover{transform:translateY(-4px) rotate(-1deg)}
.env:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.env::before{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(to bottom right,transparent 49.5%,var(--env2) 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,var(--env2) 50%) right/50% 100% no-repeat;opacity:.55}
.flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env2);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--seal);z-index:2;display:grid;place-items:center;color:#fff;font-size:15px}
.label{color:#3a1f27;position:absolute;left:10px;right:10px;bottom:12px;text-align:center;font-family:Caveat,cursive;font-weight:700;font-size:24px;line-height:1.05;z-index:2}
.env.read .seal{background:transparent;color:var(--seal)}
.env.read{opacity:.78}
dialog{border:0;padding:0;background:transparent;max-width:min(560px,92vw);width:100%;color:var(--ink)}
dialog::backdrop{background:rgba(20,28,45,.4)}
.letter{background:var(--paper);border-radius:6px;padding:30px 28px 26px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .45s ease-out;max-height:84vh;overflow:auto}
@keyframes rise{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.letter h2{font-family:Caveat,cursive;font-size:34px;margin:0 0 12px;color:var(--seal)}
.letter p{font-family:Caveat,cursive;font-size:25px;line-height:1.3;margin:0 0 12px}
.close{margin-top:10px;background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:10px 22px;font:600 15px Onest,sans-serif;cursor:pointer}
.close:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
footer{margin-top:38px;color:var(--soft);font-family:Caveat,cursive;font-size:24px}
@media (prefers-reduced-motion:reduce){.letter{animation:none}.env{transition:none}}
</style>
</head>
<body>
<main>
<h1>Открой, когда…</h1>
<p class="sub">Аля, тут несколько конвертиков для разных моментов. Не открывай всё сразу, оставь на потом. Каждый ждёт своего случая.</p>
<div class="grid" id="grid"></div>
<footer>Твой котик</footer>
</main>
<dialog id="dlg"><div class="letter" id="letter"></div></dialog>
<script>
var L=[
["когда грустно","Милая кудряшка, мне жаль, что тебе сейчас грустно. Я бы очень хотел оказаться рядом и просто обнять тебя. Грусть не навсегда, она пройдёт, как проходит любая погода. А пока укутайся в плед и знай: твой котик на твоей стороне, что бы ни случилось. Как только увидимся, я тебя так заняшу, что грусть сама убежит."],
["когда скучаешь","Я тоже скучаю, правда. Даже когда мы не рядом, ты всё равно со мной: в мыслях, в шутках, в маленьких привычках. Мне хочется проводить с тобой гораздо больше времени. Закрой глаза и представь, что я рядом, и два котика сидят в обнимку. Скоро так и будет, а пока держи крепкие обнимашки на расстоянии."],
["когда нужно улыбнуться","Улыбнись! Вспомни, что ты самая милая, красивая и любимая на свете. Вспомни, как мы с тобой два котика и как глупо мы иногда себя ведём. Если улыбка ещё не пришла, представь, что я корчу тебе рожицу прямо сейчас. Получилось? Вот и отлично."],
["когда тяжёлый день","Знаю, бывают дни, когда всё идёт не так. Ты не обязана быть сильной каждую минуту. Сделай глубокий вдох, выпей чего-нибудь тёплого и отпусти всё, что не успела. Я горжусь тобой просто за то, что ты дошла до вечера. А если захочется, прибегай ко мне няшиться, я всегда за."],
["когда сомневаешься в себе","Послушай меня внимательно: ты намного лучше, чем думаешь. Ты добрая, милая и очень красивая, со своими чудесными кудряшками. Я говорю это не только потому, что люблю тебя, а потому что вижу. Верь себе так, как я в тебя верю."],
["когда не спится","Ложись поудобнее и отпусти мысли, они подождут до утра. Представь, что я рядом, обнимаю тебя и глажу по кудряшкам. Всё хорошо, ты в безопасности. Спокойной ночи, моя любимая. Пусть тебе приснится что-нибудь тёплое, а лучше мы с тобой, два котика, в одном уютном клубочке."],
["когда злишься на меня","Если ты читаешь это, значит, я, скорее всего, где-то накосячил. Прости меня. Я не хочу, чтобы мы ссорились, и ты для меня важнее любого спора. Давай остынем, а потом поговорим спокойно. Я люблю тебя, даже когда мы не согласны. И кстати, мириться няшками тоже можно."],
["когда захочется просто так","Просто так. Потому что я люблю тебя. Потому что ты делаешь мои дни светлее, а обычный вечер с тобой становится особенным. Спасибо, что ты у меня есть, Аля. И знаешь, мне кажется, нам пора устроить вечер няшек. Ты же тоже за? 😉"],
["если любишь меня","Я люблю тебя тоже, моя милая няшечка-вкусняшечка! Я невозможно жду день нашей встречи, чтобы закошмарить тебя проявлением своей милоты и любви к тебе. Котёнок ты мой сладенький ❤️💕💗"]
];
var grid=document.getElementById("grid"),dlg=document.getElementById("dlg"),box=document.getElementById("letter");
var seen={};
try{seen=JSON.parse(localStorage.getItem("openwhen")||"{}")}catch(e){}
L.forEach(function(x,i){
  var b=document.createElement("button");
  b.className="env"+(seen[i]?" read":"");
  b.setAttribute("aria-label","Открой, "+x[0]);
  b.innerHTML='<span class="flap"></span><span class="seal">'+(seen[i]?"✓":"♥")+'</span><span class="label">Открой, '+x[0]+'</span>';
  b.onclick=function(){
    box.innerHTML="";
    var h=document.createElement("h2");h.textContent="Открой, "+x[0];box.appendChild(h);
    var p=document.createElement("p");p.textContent=x[1];box.appendChild(p);
    var c=document.createElement("button");c.className="close";c.textContent="Закрыть";c.onclick=function(){dlg.close()};box.appendChild(c);
    dlg.showModal();
    b.classList.add("read");b.querySelector(".seal").textContent="✓";
    seen[i]=1;try{localStorage.setItem("openwhen",JSON.stringify(seen))}catch(e){}
  };
  grid.appendChild(b);
});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
</script>
</body>
</html>
